<!DOCTYPE html>
<html>
<head><title>Input Persamaan Kuadrat</title></head>
<body>
    <h2>Kalkulator Persamaan Kuadrat (ax² + bx + c = 0)</h2>
    <form action="/kuadrat/hitung" method="POST">
        <label>Nilai a:</label> <input type="number" step="any" name="a" required><br><br>
        <label>Nilai b:</label> <input type="number" step="any" name="b" required><br><br>
        <label>Nilai c:</label> <input type="number" step="any" name="c" required><br><br>
        <button type="submit">Hitung Akar</button>
    </form>
</body>
</html>
